<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-200 Practice Exam</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">AI-200 <span>Practice</span></div>
  <div class="topbar-right">
    <span id="timer" class="timer" hidden></span>
    <button id="btn-nav" class="ghost" hidden>Questions</button>
    <button id="btn-home" class="ghost" hidden>Home</button>
    <button id="btn-theme" class="ghost" title="Toggle dark mode">&#9680;</button>
  </div>
</header>

<main id="app"></main>

<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><strong>Question navigator</strong><button id="drawer-close" class="ghost">Close</button></div>
  <div class="legend"><i class="dot ok"></i>Correct <i class="dot bad"></i>Wrong <i class="dot cur"></i>Current <i class="dot"></i>Not answered</div>
  <div id="grid" class="grid"></div>
</aside>

<script src="data/questions.local.js" onerror="void 0"></script>
<script src="js/storage.js"></script>
<script src="js/renderers.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
